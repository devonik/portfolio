title: Pikuro – Android app for sorting your camera roll
description: |
  Pikuro is an Android app for sorting your camera roll. Swipe left to delete, right to keep, up to put a photo into an album. It finds photo series so you can keep the best shot, and it clears out screenshots and old WhatsApp media. It can then suggest a CapCut video template whose clip count matches the album, a filter CapCut's own search doesn't have. Your photos stay on the device and nothing is deleted until you confirm, with no account, ads or subscription.
type: private
period: "09/2026 — present · Beta"
highlights:
  - "Wrote and published the npm package expo-saf-scan, which lists WhatsApp's media folders through Android's Storage Access Framework. It scanned 15,733 files in about 27 s on a real device (debug build)."
  - "Found two bugs in expo-media-library and fixed them upstream in Expo (expo/expo #50621, #50817)."
  - "Turned on R8 code shrinking, which cut the app code (dex) in the release APK from 58 MB to 20 MB."
