description: |
  A product search for the Bitcoin community: it shows products that can be paid for with Bitcoin, offers Bitcoin discounts, or pays cashback in sats. The search index is Algolia, fed by a crawler that pulls product data from 1,000+ shops (e-commerce, domain providers, eSIM providers and more). I built the crawler on Crawl4AI, which discovers a reusable CSS extraction schema per shop once so production crawls run without per-request LLM cost. Users authenticate through Nostr rather than a classic login. Built solo.
title: Website for price comparison within the bitcoin community
